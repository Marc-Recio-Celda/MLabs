<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLabs & NEXUS — Operations Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <header>
    <div class="hud-topbar">
      <div class="hud-brand">
        <a href="#/front" class="logo-badge" title="MLabs Constitution">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">MLabs</span>
        </a>
        <span class="hud-sep">/</span>
        <div class="instance-badge">
          <span class="pulse-dot"></span>
          <span class="instance-name">NEXUS</span>
        </div>
      </div>

      <div class="hud-active-front" id="hudActiveFront" title="Frente Activo actual (Schedule.md)">
        <span class="front-marker">▶ ACTIVE FRONT</span>
        <span class="front-title">loading active front...</span>
      </div>

      <div class="hud-controls">
        <span class="meta-count" id="count">loading…</span>
      </div>
    </div>

    <!-- MAIN CATEGORY TABS -->
    <nav class="nav-tabs-bar" id="tabs">
      <!-- DYNAMICALLY RENDERED BY APP.JS FROM MODEL -->
    </nav>
  </header>

  <main id="main">
    <div class="loading-state">
      <div class="spinner"></div>
      <h3>Loading operations model...</h3>
      <p>Fetching entities from <code>/api/model</code></p>
    </div>
  </main>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>
